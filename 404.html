    <script>
      if (typeof window !== 'undefined') {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
      }
      
      // Global function to hide and remove the initial loader
      window.hideAppLoader = function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 200);
        }
      };

      // Failsafe auto-dismiss
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(window.hideAppLoader, 1000);
      });
      window.addEventListener('load', function() {
        setTimeout(window.hideAppLoader, 300);
      });

      // Unregister any stale service workers to prevent cached outdated assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
          }
        }).catch(function(err) {});
      }
    </script>

      }
